# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Bases de datos Oracle
site_description: Documentación del repositorio Bases de datos Oracle
site_author: Gustavo Harnisch
site_url: https://gustavo-harnisch.github.io/Bases-de-datos-oracle/
repo_url: https://github.com/Gustavo-Harnisch/Bases-de-datos-oracle
repo_name: Gustavo-Harnisch/Bases-de-datos-oracle
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  custom_dir: overrides
  language: es
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Usar preferencia del sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a tema oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a tema automatico

plugins:
  - search:
      lang: es
  # Debe ser el último plugin: compone la versión imprimible después de que los
  # demás plugins hayan procesado todas las páginas.
  - print-site:
      add_to_navigation: true
      print_page_title: Imprimir o descargar PDF
      print_page_basename: imprimir
      add_print_site_banner: true
      print_site_banner_template: overrides/print_site_banner.tpl
      add_table_of_contents: true
      toc_title: Índice general
      toc_depth: 3
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: true
      path_to_pdf: assets/pdf/bases-de-datos-oracle.pdf

extra_css:
  - stylesheets/print.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      check_paths: true
      restrict_base_path: true

# Los fragmentos son componentes de otras paginas, no paginas navegables.
exclude_docs: |
  _includes/

