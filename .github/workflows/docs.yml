name: Documentación

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - overrides/**
      - mkdocs.yml
      - requirements-docs.txt
      - scripts/build-docs-pdf.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - overrides/**
      - mkdocs.yml
      - requirements-docs.txt
      - scripts/build-docs-pdf.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validar y compilar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Compilar el sitio y generar el PDF
        env:
          PYTHON_BIN: python
          CHROME_BIN: google-chrome
        run: ./scripts/build-docs-pdf.sh

      - name: Guardar el PDF como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: bases-de-datos-oracle-pdf
          path: site/assets/pdf/bases-de-datos-oracle.pdf
          if-no-files-found: error

      - name: Preparar artefacto para GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v5
